name: Release APK

# Cut a release by pushing a tag like `v1.2`:
#   git tag v1.2 && git push origin v1.2
# The job builds the release APK, and (only if the signing secrets are set) publishes the
# SIGNED apk as a GitHub Release asset. Without the keystore secrets the release APK is left
# unsigned by build.gradle.kts and Android cannot install it, so signing secrets are required
# for a distributable release:
#   RELEASE_KEYSTORE_BASE64  - `base64 -w0 release.keystore`
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          gradle-version: 8.4

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

      # Same gate as build.yml: a tag push must not publish an APK built on broken tests.
      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Fail early if signing secrets are missing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # All four secrets are required: without any one of them the APK ends up unsigned and
          # Android cannot install it.
          missing=""
          for var in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [ -z "${!var}" ] && missing="$missing $var"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secrets:$missing - the release APK would be unsigned"
            echo "::error::and Android cannot install an unsigned APK. Set the keystore secrets first."
            exit 1
          fi

      - name: Decode release keystore
        id: keystore
        env:
          # Step-scoped on purpose: a job-level secret would be exposed to every step in the job.
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "keystore_path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build signed Release APK
        run: gradle assembleRelease
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Publish GitHub Release with the signed APK
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
