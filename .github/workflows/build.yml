name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Release signing:
#   Provide these repository secrets ONCE (generate the keystore locally a single time):
#     RELEASE_KEYSTORE_BASE64  - `base64 -w0 release.keystore`
#     RELEASE_KEYSTORE_PASSWORD
#     RELEASE_KEY_ALIAS
#     RELEASE_KEY_PASSWORD
#   When the secret is absent the release APK is simply left unsigned (build.gradle.kts already
#   falls back to "unsigned" rather than to a public debug key) - it is NEVER re-generated on the
#   fly, so update-in-place of an installed release keeps working (stable signing identity).

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          gradle-version: 8.4

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

      # The whole suite, not a hand-picked subset: naming individual classes here meant every test
      # that was not on the list (packet parsing, desync engine, MTProto framing, byedpi argument
      # sanitising) could be broken and still merge behind a green check.
      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Upload failed unit-test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          # A compile failure produces no JUnit report — that must not mask the real failure
          # with an artifact-upload error.
          if-no-files-found: ignore
          retention-days: 1

      - name: Publish failed test error
        if: ${{ failure() }}
        run: |
          python3 - <<'PY'
          from glob import glob
          from xml.etree import ElementTree

          # sorted() so the surfaced failure is the same one on every re-run: glob() returns
          # directory order, which was harmless with two report files and is not with eight.
          for report in sorted(glob("app/build/test-results/testDebugUnitTest/*.xml")):
              root = ElementTree.parse(report).getroot()
              for case in root.findall(".//testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is None:
                      continue
                  detail = (failure.get("message", "") + " " + (failure.text or "")).strip()
                  detail = detail[:3000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{detail}")
                  raise SystemExit
          print("::error title=testDebugUnitTest::JUnit did not produce a failure detail")
          PY

      - name: Decode release keystore
        id: keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          # Step-scoped on purpose: as a job-level env the base64 keystore was also exposed to the
          # unit-test step, where any third-party test dependency could read it.
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "keystore_path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tg-ws-proxy-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Build Release APK
        run: gradle assembleRelease
        env:
          # Empty when no keystore secret is set -> build.gradle.kts leaves the release unsigned
          # instead of signing with a throwaway/public key.
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # "-unsigned" suffix when the keystore secret is absent: the APK is not installable then,
          # and the plain "-release" name suggested otherwise.
          name: tg-ws-proxy-release${{ steps.keystore.outputs.keystore_path == '' && '-unsigned' || '' }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
